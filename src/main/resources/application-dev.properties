# Local development - PostgreSQL on port 5432
spring.datasource.url=jdbc:postgresql://localhost:5432/stark_group_vms
spring.datasource.username=${DB_USER:postgres}
# Read from the DB_PASSWORD environment variable so the real password is never
# committed. Set it once with:  setx DB_PASSWORD "your-password"
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate creates/updates the schema automatically for local convenience.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
