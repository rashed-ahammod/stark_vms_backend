# Production - credentials supplied by the environment, never committed.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Never let Hibernate mutate a production schema. Apply the schema once before
# the first deploy (see API.md) and Hibernate only verifies it matches the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Connection pool sized for a small instance talking to a remote managed database.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
# Recycle connections before a remote host drops them for inactivity.
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=120000

# Keep error bodies in the shape documented in API.md.
server.error.include-message=never
server.error.include-stacktrace=never
