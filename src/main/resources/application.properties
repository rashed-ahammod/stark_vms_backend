spring.application.name=stark-group-vms

# Render (and most PaaS hosts) inject the port to bind on via PORT.
# Falls back to 9001 for local development.
server.port=${PORT:9001}

# Default to the dev profile so local runs use the local PostgreSQL datasource.
# Override in deployment with SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=dev

# Preserve field declaration order in JSON responses instead of sorting alphabetically
spring.jackson.mapper.sort-properties-alphabetically=false

# Authentication - all values come from the environment, never committed.
# JWT_SECRET must be at least 32 characters.
app.security.jwt-secret=${JWT_SECRET:}
app.security.jwt-expiry-seconds=${JWT_EXPIRY_SECONDS:86400}
app.security.admin-username=${ADMIN_USERNAME:}
app.security.admin-password=${ADMIN_PASSWORD:}
app.security.admin-full-name=${ADMIN_FULL_NAME:Administrator}

# Browser origins allowed to call the API. Set CORS_ALLOWED_ORIGINS in production
# to the Flutter Web domain, e.g. https://stark-vms.onrender.com
app.security.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Health endpoint for the platform's health check. Only /actuator/health is
# exposed; no other actuator endpoint is reachable.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
