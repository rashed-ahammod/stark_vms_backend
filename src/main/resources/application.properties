spring.application.name=stark-group-vms

# Render (and most PaaS hosts) inject the port to bind on via PORT.
# Falls back to 9001 for local development.
server.port=${PORT:9001}

# Default to the dev profile so local runs use the local PostgreSQL datasource.
# Override in deployment with SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=dev

# Preserve field declaration order in JSON responses instead of sorting alphabetically
spring.jackson.mapper.sort-properties-alphabetically=false
